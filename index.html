<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - Part 3</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 30px 20px;
        }
        .game-container {
            text-align: center;
            max-width: 450px;
            margin: 0 auto;
        }
        h1 {
            color: #d32f2f;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        .turn-indicator {
            background-color: #fff;
            border: 3px solid #333;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .board {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: inline-block;
            margin-bottom: 20px;
        }
        .square {
            width: 100px;
            height: 100px;
            background-color: #e8e8e8;
            border: 3px solid #333;
            display: inline-block;
            margin: 5px;
            font-size: 60px;
            font-weight: bold;
            line-height: 100px;
            text-align: center;
            cursor: pointer;
            vertical-align: top;
            color: #333;
            transition: background-color 0.3s ease;
        }
        .square:hover {
            background-color: #ffb7ce;
        }
        /* Create 3x3 grid layout - force line breaks every 3 squares */
        .square:nth-child(4),
        .square:nth-child(7) {
            clear: left;
        }
        .win-message {
            background-color: #fff;
            border: 3px solid #4caf50;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #4caf50;
            min-height: 20px;
        }
        .start-button {
            background-color: #2196f3;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background-color 0.3s ease;
        }
        .start-button:hover {
            background-color: #1976d2;
        }
        .square.occupied {
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1> Tic Tac Toe - Let's go! </h1>
        
        <button class="start-button" onclick="startNewGame()">Start Game</button>
        
        <div class="turn-indicator" id="turnDisplay">
            Click Start Game to Begin!
        </div>

        <div class="board">
            <script>
                const NUM_SQUARES = 9;
                for (i=0; i<NUM_SQUARES; i++)
                {
                    id = "sq"+i;
                    document.write( "<div class='square' id='" + id + "'></div>" );
                }
            </script>
        </div>

        <div class="win-message" id="messageBox">
            
        </div>
    </div>

    <script>
        let activePlayer = "X"; 
        let canPlay = false; 

        function handleSquareClick(event) {
            let clickedSquare = event.target;
            let squareNumber = clickedSquare.id.replace("sq", "");
            
            if (!canPlay) {
                return;
            }
            
            if (clickedSquare.innerText !== "") {
                return;  // Square already filled, do nothing
            }
            
            clickedSquare.innerText = activePlayer;
            clickedSquare.classList.add("occupied");
            
            if (activePlayer === "X") {
                activePlayer = "O";
            } else {
                activePlayer = "X";
            }
            
            document.getElementById("turnDisplay").innerText = activePlayer + "'s Turn";
        }

        function startNewGame() {
            let randomStart = Math.floor(Math.random() * 2);
            if (randomStart === 0) {
                activePlayer = "X";
            } else {
                activePlayer = "O";
            }
            
            for (let idx = 0; idx < NUM_SQUARES; idx++) {
                let currentSquare = document.getElementById("sq" + idx);
                currentSquare.innerText = "";
                currentSquare.classList.remove("occupied");
            }
            
            canPlay = true;
            
            document.getElementById("turnDisplay").innerText = activePlayer + "'s Turn";
            document.getElementById("messageBox").innerText = "";
        }

        window.onload = function() {
            for (let position = 0; position < NUM_SQUARES; position++) {
                let squareElement = document.getElementById("sq" + position);
                squareElement.addEventListener("click", handleSquareClick);
            }
        };
    </script>
</body>
</html>
